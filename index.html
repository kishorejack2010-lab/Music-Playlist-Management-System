<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TamilBeats – Home</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="bg3d"></canvas>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-icon">♪</span>
    <span class="logo-name">TamilBeats</span>
  </div>

  <nav class="sidebar-nav">
    <a class="nav-item active" onclick="showPage('home')">
      <span class="nav-ic">🏠</span><span>Home</span>
    </a>
    <a class="nav-item" onclick="showPage('search')">
      <span class="nav-ic">🔍</span><span>Search</span>
    </a>
    <a class="nav-item" onclick="showPage('library')">
      <span class="nav-ic">📚</span><span>Your Library</span>
    </a>
    <a class="nav-item" onclick="showPage('history')">
      <span class="nav-ic">🕐</span><span>History</span>
    </a>
  </nav>

  <div class="sidebar-section">
    <p class="sidebar-label">Artists</p>
    <div class="artist-list" id="sidebar-artists"></div>
  </div>

  <div class="sidebar-bottom">
    <div class="user-info" id="user-info">
      <div class="user-avatar" id="user-avatar">U</div>
      <span id="user-name">User</span>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</aside>

<!-- MAIN CONTENT -->
<main class="main-content">
  <header class="top-bar">
    <div class="nav-arrows">
      <button onclick="history.back()">‹</button>
      <button onclick="history.forward()">›</button>
    </div>
    <div class="search-bar-top">
      <span>🔍</span>
      <input type="text" placeholder="Search songs, artists..." id="search-input" oninput="onSearch()">
    </div>
    <div class="top-right">
      <span class="greeting" id="greeting">Good evening!</span>
    </div>
  </header>

  <!-- HOME PAGE -->
  <section class="page active" id="page-home">
    <h2 class="page-title">Featured Artists</h2>
    <div class="artists-grid" id="artists-grid"></div>

    <h2 class="page-title" style="margin-top:40px">🔥 Trending Now</h2>
    <div class="trending-list" id="trending-list"></div>
  </section>

  <!-- ARTIST PAGE -->
  <section class="page" id="page-artist">
    <div class="artist-hero" id="artist-hero">
      <div class="artist-hero-img" id="ah-img"></div>
      <div class="artist-hero-info">
        <p class="ah-verified">✔ Verified Artist</p>
        <h1 id="ah-name"></h1>
        <p id="ah-bio"></p>
        <div class="ah-actions">
          <button class="btn-play-all" onclick="playAll()">▶ Play All</button>
          <button class="btn-shuffle" onclick="shuffleAll()">⇄ Shuffle</button>
        </div>
      </div>
    </div>
    <h3 class="songs-label">Popular Songs</h3>
    <div class="songs-list" id="songs-list"></div>
  </section>

  <!-- SEARCH PAGE -->
  <section class="page" id="page-search">
    <h2 class="page-title">Search Results</h2>
    <div class="songs-list" id="search-results"></div>
  </section>

  <!-- LIBRARY PAGE -->
  <section class="page" id="page-library">
    <h2 class="page-title">Your Library</h2>
    <div class="artists-grid" id="library-grid"></div>
  </section>

  <!-- HISTORY PAGE -->
  <section class="page" id="page-history">
    <h2 class="page-title">Play History</h2>
    <div class="history-stats" id="history-stats"></div>
    <h3 class="songs-label">Recently Played</h3>
    <div class="songs-list" id="history-list"></div>
  </section>
</main>

<!-- NOW PLAYING BAR -->
<footer class="player-bar" id="player-bar">
  <div class="player-left">
    <div class="now-thumb" id="now-thumb"></div>
    <div class="now-info">
      <div class="now-title" id="now-title">No song playing</div>
      <div class="now-artist" id="now-artist">—</div>
    </div>
    <button class="heart-btn" id="heart-btn" onclick="toggleHeart()">♡</button>
  </div>

  <div class="player-center">
    <div class="controls">
      <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">⇄</button>
      <button class="ctrl-btn" onclick="prevSong()" title="Previous">⏮</button>
      <button class="play-btn" id="play-btn" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="nextSong()" title="Next">⏭</button>
      <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" title="Repeat">↻</button>
    </div>
    <div class="progress-row">
      <span class="time" id="time-cur">0:00</span>
      <div class="progress-bar" id="progress-bar" onclick="seek(event)">
        <div class="progress-fill" id="progress-fill"></div>
        <div class="progress-thumb" id="progress-thumb"></div>
      </div>
      <span class="time" id="time-dur">0:00</span>
    </div>
  </div>

  <div class="player-right">
    <button class="ctrl-btn" onclick="toggleMute()" id="mute-btn">🔊</button>
    <input type="range" class="vol-slider" id="vol-slider" min="0" max="100" value="80" oninput="setVol(this.value)">
  </div>
</footer>

<!-- AUDIO ELEMENT -->
<audio id="audio-player" preload="auto"></audio>

<script src="js/data.js"></script>
<script src="js/player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
